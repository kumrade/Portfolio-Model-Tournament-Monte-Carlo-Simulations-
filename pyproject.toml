[project]
name = "portfolio-model-tournament"
version = "1.0.0"
description = "Walk-forward portfolio model comparison and Monte Carlo risk analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
